name: Build CI image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jayanp/gradient-ci:latest
