name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-image:
    name: Build CI image
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/kingjayan/gradient-ci:latest
          cache-from: type=registry,ref=ghcr.io/kingjayan/gradient-ci:latest
          cache-to: type=inline
          provenance: false

  check:
    name: Type-check, lint & test
    needs: [build-image]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kingjayan/gradient-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - run: pnpm install --frozen-lockfile

      - run: pnpm run type-check

      - run: pnpm run lint

      - run: pnpm test

      - run: pnpm audit --audit-level high
